# Deploys the playground to GitHub Pages (the live demo) on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vectoad/luxebook-playground build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/playground/dist
      - id: deployment
        uses: actions/deploy-pages@v4
