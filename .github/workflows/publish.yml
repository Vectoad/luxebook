# Publishes all packages to GitHub Packages when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# The tag sets the version of every package (no manual bumps).
name: Publish packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@vectoad"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Set version from tag
        run: pnpm -r --filter "./packages/*" exec npm pkg set version="${GITHUB_REF_NAME#v}"
      - run: pnpm build
      - run: pnpm -r --filter "./packages/*" publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
